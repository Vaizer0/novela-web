name: verify-source-runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          GH_PAGES: "1"
      - name: Assert bundled Lua sources exist in build input
        run: |
          test -n "$(find src/assets/plugins -type f -name '*.lua' -print -quit)"
          test "$(find src/assets/plugins -type f -name '*.lua' | wc -l)" -ge 10
          test -f src/assets/plugins/asurascans.lua
          test -f src/assets/plugins/truthnovel.lua
