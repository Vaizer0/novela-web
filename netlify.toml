[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Function routes must precede the SPA catch-all (redirects shadow functions).
[[redirects]]
  from = "/api/fetch/raw"
  to = "/.netlify/functions/raw"
  status = 200

[[redirects]]
  from = "/api/fetch"
  to = "/.netlify/functions/fetch"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
